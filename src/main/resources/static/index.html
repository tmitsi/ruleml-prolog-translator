    <style>
        body {
            padding: 2em;
            width: 100%;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            height: 10%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .translator-container {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            flex: 1;
            margin-bottom: 1em;
        }

        .translator-column {
            width: 45%;
            margin: 0 1em;
            flex: none;
        }

        .middle-column {
            width: 10%;
            display: grid;
            justify-content: center;
            align-items: center;
            margin: 0 1em;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            flex-grow: 1;
        }

        .query-container {
            margin-top: 1em;
            flex-grow: 1;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #executeButton .content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #executeButton img {
            margin-top: 5px;
            width: 80%;
        }

        .message-field {
            color: red;
            margin-top: 1em;
        }

        .CodeMirror {
            border: 2px solid #ccc;
            border-radius: 6px;
            flex-grow: 1;
        }

        .cm-matchhighlight {
            background: lightgrey !important
        }

        .arrow-right {
            position: relative;
            padding-right: 2rem;
        }

        .arrow-right::after {
            content: "";
            position: absolute;
            top: 50%;
            right: 1rem;
            margin-top: -0.5rem;
            border-top: 0.5rem solid transparent;
            border-bottom: 0.5rem solid transparent;
            border-left: 0.5rem solid white;
        }

        .arrow-left {
            position: relative;
            padding-left: 2rem;
        }

        .arrow-left::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 1rem;
            margin-top: -0.5rem;
            border-top: 0.5rem solid transparent;
            border-bottom: 0.5rem solid transparent;
            border-right: 0.5rem solid white;
        }
    </style>
</head>
<body>
<section class="section">
    <div class="container">
        <h2 class="title">Prolog <-> RuleML Bidirectional Translator</h2>
        <div class="translator-container">
            <div class="translator-column">
                <label for="prologText" class="label">Prolog KB</label>
                <textarea id="prologText" class="textarea"></textarea>
                <div class="query-container">
                    <label for="queriesText" class="label">Prolog Queries</label>
                    <textarea id="queriesText" class="textarea"></textarea>
                </div>
            </div>
            <div class="middle-column">
                <div class="buttons">
                    <button id="toRuleML" class="button is-responsive is-primary arrow-right">to RuleML</button>
                    <button id="toProlog" class="button is-responsive is-link arrow-left">to Prolog</button>
                    <button id="exampleButton" class="button is-responsive is-info">Example</button>
                    <button id="executeButton" class="button is-responsive is-success">
						<span class="content">
							Execute with
							<img src="images/tauprolog.svg" alt="Tau Prolog">
						</span>
                    </button>
                    <button id="nextButton" class="button is-responsive is-info is-light" style="visibility: hidden;">
                        Next Solution
                    </button>
                </div>
            </div>
            <div class="translator-column">
                <label for="ruleMLText" class="label">RuleML</label>
                <textarea id="ruleMLText" class="textarea"></textarea>
            </div>
        </div>
        <div id="currentQueryBox" style="font-family: monospace;"></div>
        <div id="messages" style="font-family: monospace" class="message-field"></div>
    </div>
</section>

        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="text/javascript" src = "/js/codemirror/simple.js"></script>

<script id="initialization">

    function setEditorSizes() {
        const containerHeight = document.querySelector('.translator-column').clientHeight;
        const prologEditorHeight = (containerHeight * 0.5) - 10;
        const queryEditorHeight = (containerHeight * 0.2) - 10;
        const ruleMLEditorHeight = (containerHeight * 0.75);

        prologEditor.setSize(null, prologEditorHeight);
        prologQEditor.setSize(null, queryEditorHeight);
        ruleMLEditor.setSize(null, ruleMLEditorHeight);
    }


    const prologKB = '% Enter your Prolog KB here\n'
    const prologQuery = '% Enter your Prolog queries here\n'
    const ruleMLDocument = '<!-- Enter the RuleML document here -->\n'

    const prologKBExample = '% Example from https://swish.swi-prolog.org/example/lists.pl\n' +
        '\n' +
        'suffix(Xs, Ys) :-\n' +
        '    append(_, Ys, Xs).\n' +
        '\n' +
        'prefix(Xs, Ys) :-\n' +
        '    append(Ys, _, Xs).\n' +
        '\n' +
        'sublist(Xs, Ys) :-\n' +
        '    suffix(Xs, Zs),\n' +
        '    prefix(Zs, Ys).\n' +
        '\n' +
        'nrev([], []).\n' +
        'nrev([H|T0], L) :-\n' +
        '\tnrev(T0, T),\n' +
        '\tappend(T, [H], L).\n'

    const prologQueryExample = '% queries\n' +
        '?- sublist([a, b, c, d, e], [c, d]).\n' +
        '?- sublist([a, b, c, d, e], Ys).\n' +
        '?- nrev([a, b, c, d, e], L).'

    let prologEditor = CodeMirror.fromTextArea(document.getElementById('prologText'), {
        lineNumbers: true,
        mode: 'prolog',
        matchBrackets: true,
        styleActiveLine: true,
        highlightSelectionMatches: {
            minChars: 2,
            showToken: /\w/,
            style: 'matchhighlight',
            annotateScrollbar: true
        }
    });
    prologEditor.setValue(prologKB)


    let prologQEditor = CodeMirror.fromTextArea(document.getElementById('queriesText'), {
        lineNumbers: true,
        mode: 'prolog',
        matchBrackets: true,
        styleActiveLine: true,
        highlightSelectionMatches: {
            minChars: 2,
            showToken: /\w/,
            style: 'matchhighlight',
            annotateScrollbar: true
        }
    });
    prologQEditor.setValue(prologQuery);

    let ruleMLEditor = CodeMirror.fromTextArea(document.getElementById('ruleMLText'), {
        lineNumbers: true,
        mode: 'xml',
        styleActiveLine: true,
        highlightSelectionMatches: {
            minChars: 2,
            showToken: /\w/,
            style: 'matchhighlight',
            annotateScrollbar: true
        }
    });
    ruleMLEditor.setValue(ruleMLDocument)

    setEditorSizes();

    window.addEventListener('resize', setEditorSizes);
    let messageBox = document.getElementById('messages');
</script>
<script id="tau-prolog">
    let tauSession;
    let queries = [];
    let qi = 0;
    let currentQuery = "";
    let waitingForNextQuery = false;

    function preprocessQueries(rawQueries) {
        return rawQueries
            .replace(/%.*/g, "") // strip inline comments
            .replace(/\?-/g, "") // remove '?-' if present
            .split(/\.\s*/) // split on period + optional whitespace TODO: floats?
            .map(s => s.trim())
            .filter(Boolean); // drop any empty strings
    }

    async function executeQuery() {
        queries = preprocessQueries(prologQEditor.getValue());
        qi = 0; // index
        document.getElementById('currentQueryBox').innerText = "";
        messageBox.innerText = "";
        toggleNextButton(false);

        if (queries.length === 0) {
            messageBox.style.color = 'red';
            messageBox.innerText = "Error: no queries found.";
            return;
        }

        tauSession = pl.create();
        const kb = ':- use_module(library(lists)).\n' + prologEditor.getValue();
        try {
            await tauSession.promiseConsult(kb);
            await runNextQuery();
        } catch (err) {
            messageBox.style.color = 'red';
            messageBox.innerText = "Consult error: " + err;
        }
    }

    async function runNextQuery() {
        currentQuery = queries[qi];
        document.getElementById('currentQueryBox')
            .innerText = `?- ${currentQuery}.`;

        const q = currentQuery.endsWith('.')
            ? currentQuery
            : currentQuery + '.';

        try {
            await tauSession.promiseQuery(q);
            await displayNextAnswer();
        }
        catch (err) {
            messageBox.style.color = 'red';
            messageBox.innerText = "Query error: " + err;
            toggleNextButton(false);
        }
    }

    async function displayNextAnswer() {
        if (!tauSession || qi >= queries.length) {
            messageBox.style.color = 'red';
            messageBox.innerText = "Error: no query.";
            toggleNextButton(false);
            return;
        }

        try {
            const answer = await tauSession.promiseAnswer();
            messageBox.style.color = 'black';

            if (answer !== false) {  // regular answer: show it
                messageBox.innerText = tauSession.format_answer(answer);
                waitingForNextQuery = false;
                toggleNextButton(true);

            }
            else {
                if (!waitingForNextQuery) { // first time 'false' for this query: display it
                    messageBox.innerText = "false";
                    waitingForNextQuery = true;
                    toggleNextButton(true);
                }
                else { // second click: advance to next query
                    waitingForNextQuery = false;
                    qi++;
                    if (qi < queries.length) {
                        await runNextQuery();
                    }
                    else {
                        messageBox.innerText = "All queries finished.";
                        toggleNextButton(false);
                    }
                }
            }
        }
        catch (err) {
            messageBox.style.color = 'red';
            messageBox.innerText = "Answer error: " + err;
            toggleNextButton(false);
        }
    }

    function toggleNextButton(show) {
        document.getElementById('nextButton')
            .style.visibility = show ? 'visible' : 'hidden';
    }

    document.getElementById('executeButton')
        .addEventListener('click', executeQuery);

    document.getElementById('nextButton')
        .addEventListener('click', displayNextAnswer);
</script>

<script id="translation-buttons">
    document.getElementById('toRuleML').addEventListener('click', async () => {
        const kb = prologEditor.getValue();
        const queries = prologQEditor.getValue();
        try {
            const response = await
                fetch(`/toRuleML?kb=${encodeURIComponent(kb)}&queries=${encodeURIComponent(queries)}&pprint=true`);
            const result = await response.json();
            if (result.xml) {
                ruleMLEditor.setValue(result.xml);
            }
            if (result.messages) {
                messageBox.style.color = 'red'
                messageBox.innerText = result.messages;
            } else {
                messageBox.innerText = '';
            }
        } catch (error) {
            messageBox.style.color = 'red'
            messageBox.innerText = 'Error translating to RuleML';
        }
    });

    document.getElementById('toProlog').addEventListener('click', async () => {
        const ruleMLText = ruleMLEditor.getValue();
        try {
            const response = await fetch(`/toProlog?ruleMLText=${encodeURIComponent(ruleMLText)}`);
            const result = await response.json();
            if (result.kb) {
                prologEditor.setValue(result.kb);
            } else {
                prologEditor.setValue("");
            }
            if (result.queries) {
                prologQEditor.setValue(result.queries);
            } else {
                prologQEditor.setValue("");
            }
            if (result.messages) {
                messageBox.style.color = 'red'
                messageBox.innerText = result.messages;
            } else {
                messageBox.innerText = '';
            }
        } catch (error) {
            messageBox.style.color = 'red'
            messageBox.innerText = 'Error translating to Prolog';
        }
    });
    document.getElementById('exampleButton').addEventListener('click', async () => {
        prologEditor.setValue(prologKBExample);
        prologQEditor.setValue(prologQueryExample);
    });

</script>
</body>
